[package]
name = "datalayers-adapter-nif"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
build = "build.rs"

[lib]
name = "datalayers_nif"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0.104"
arrow-array = { version = "58.3", features = ["chrono-tz"] }
arrow-buffer = "58.3"
arrow-cast = { version = "58.3", features = ["prettyprint"] }
arrow-flight = { version = "58.3", features = [
    "flight-sql",
    "tls-ring",
] }
arrow-schema = "58.3"
chrono = "0.4"
futures = "0.3.34"
lazy_static = "1.5.1"
prost = "0.14.4"
regex = "1.13.1"
rustler = "0.39"
tokio = { version = "1.54.1", features = ["full"] }
tonic = { version = "0.14.2", features = ["tls-ring"] }
tonic-prost = "0.14.2"
